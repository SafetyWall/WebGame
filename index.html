<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Party RPG — 베이스</title>
  <style>
    body { font-family: ui-monospace, monospace; background: #111; color: #ddd; padding: 1rem; line-height: 1.5; }
    #app { max-width: 640px; margin: 0 auto; }
    h2 { color: #fc6; }
    section { border-top: 1px solid #333; padding: .5rem 0; }
    .hp { color: #6c6; }
    .mob { color: #e88; }
    .mob.boss { color: #f84; font-weight: bold; }
    .traits { color: #fc6; }
    .log { color: #9af; font-size: .9em; }
    .skills { font-size: .85em; color: #aaa; margin-top: .15rem; }
    .skills button { padding: 0 .35rem; margin: 0 .1rem; }
    .preview { border: 1px solid #444; padding: .5rem; margin: .5rem 0; border-radius: 4px; }
    .roster { list-style: none; padding: 0; }
    .roster li { padding: .3rem 0; border-bottom: 1px solid #222; }
    .roster li.in-party { color: #6c6; }
    .actions { margin: .75rem 0; }
    button { font-family: inherit; background: #243; color: #cfc; border: 1px solid #485; border-radius: 4px; padding: .25rem .6rem; margin: 0 .2rem; cursor: pointer; }
    button:hover { background: #365; }
    button:disabled { opacity: .5; cursor: not-allowed; background: #222; color: #777; }
    .party-count.full { color: #fc6; font-weight: bold; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="src/ui/main.js"></script>
</body>
</html>
